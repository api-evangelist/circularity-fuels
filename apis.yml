name: Circularity Fuels
description: Circularity Fuels builds AI-controlled, mass-manufacturable reactors that turn waste
  carbon and cheap renewable power into drop-in hydrocarbons, starting with affordable sustainable
  aviation fuel (SAF). Its Ouro Reactor reforms waste carbon (methane and CO2 off-gassed by dairy
  farms, agricultural plants, and industrial facilities) into clean syngas, and its Aion Reactor
  uses next-generation Fischer-Tropsch synthesis to assemble that syngas into liquid fuels. The
  company is a portfolio company of DCVC and was added to the API Evangelist network as a company
  profile. It is a hardware and process company with no public developer API, SDK, or documentation
  surface at this time.
